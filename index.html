<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Birds Punctuate the Days | Joyce Clement</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="page-container">
        <header class="page-header">
            <h2>Header</h2>
        </header>

        <section class="title-section">
            <h1>Birds Punctuate the Days</h1>
            <p class="author">By Joyce Clement</p>
        </section>

        <main class="main-content">
            <div class="image-box">
                <img src="img/Haiku_image.jpg" alt="A blue speckled egg resting in a nest of grass">
            </div>

            <section class="haiku-box" aria-label="Haiku poem">
                <h2>Haiku</h2>
                <p>Period<br>
                One blue egg all summer long<br>
                Now gone</p>
            </section>
        </main>

        <footer class="page-footer">
            <h2>Footer</h2>
        </footer>
    </div>
</body>
</html>
